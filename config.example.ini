# Autonomous Code Generation - Configuration
# Copy to config.ini and fill in your values.
# Supports GitHub and Bitbucket

[repository]
platform = github
repo_url = https://github.com/owner/repo.git
base_branch = main
feature_branch = 

[github_config]
# Use env vars: GITHUB_TOKEN or BITBUCKET_APP_PASSWORD (recommended)
auth_token = <your_token_or_leave_empty_for_env>
use_env = true

[ai]
# Provider: openai | anthropic | gemini | bedrock | cdao | azure
provider = openai
# Use env: OPENAI_API_KEY (openai), ANTHROPIC_API_KEY (anthropic), GEMINI_API_KEY (gemini)
api_key = <your_api_key>
# Override env var: api_key_env = ANTHROPIC_API_KEY
model = gpt-4o
# Optional: base_url for Azure/custom endpoints
# base_url = https://your-endpoint.openai.azure.com/
verbose = false
# For provider = bedrock or cdao (org Bedrock BYOA via cdao)
# aws_account_number =
# aws_region = us-east-1
# workspace_id =
# is_execution_role = false
# model = arn:aws:bedrock:us-east-1:ACCOUNT:application-inference-profile/PROFILE_ID
#
# Sample [ai] for Bedrock (uncomment and replace with your values):
# [ai]
# provider = bedrock
# model = arn:aws:bedrock:us-east-1:098034167131:application-inference-profile/hi952c095hw3
# aws_account_number = 098034167131
# aws_region = us-east-1
# workspace_id = 904071
# is_execution_role = false
#
# Sample [ai] for Azure OpenAI (uncomment and set provider = azure):
# provider = azure
# model = gpt-4o
# endpoint = https://your-endpoint.openai.azure.com/
# deployment_name = your-deployment
# api_version = 2024-02-15-preview
# api_key = <your_azure_openai_api_key>
# # For certificate auth (cert from S3): tenant_id, client_id, scope, s3_bucket_name, azure_cert_file_name
# tenant_id =
# client_id =
# scope = https://cognitiveservices.azure.com/.default
# s3_bucket_name =
# azure_cert_file_name =

[workflow]
work_dir = ./workspace
cleanup_after_pr = false
grep_patterns =
reference_pr =
use_agent = false

[agent]
max_turns = 50
plan_max_turns = 30
ask_max_turns = 20
smart_summarization = true
truncation_limit = 30000
show_activity = true
command_allowlist_only = false
allowed_command_prefixes = pytest,python,mvn,./mvnw,gradle,./gradlew,npm,npx
blocked_commands = rm -rf /,mkfs,dd if=,shutdown,reboot
circuit_breaker_threshold = 5
circuit_breaker_timeout = 60
rate_limit_max_tokens = 10
rate_limit_refill_rate = 1.0
# Git Context Controller (structured memory checkpointing)
gcc_enabled = false
gcc_storage_dir =

[testing]
run_tests = true
max_regenerate_attempts = 3
test_timeout = 120
testing_strategy = auto

[context]
# Use modular pipeline (grep from requirements, optional similarity/call graph)
use_pipeline = false
grep_enricher = true
grep_from_requirements = true
# Optional: similarity search (requires sentence-transformers)
similarity_enricher = false
similarity_top_k = 5
# Optional: call graph traversal (Python; Java requires javalang)
call_graph_enricher = false
call_graph_depth = 2
max_files = 30
max_chars_per_file = 4000

[consciousness]
backend = file
cache_dir = .consciousness
max_age_hours = 24

[knowledge]
backend = file
# storage_dir = ~/.code-autonomy/knowledge
storage_dir =
opensearch_url =
opensearch_index =
aws_region =

# ─── Repo knowledge files ───
# Place in your repository root to teach the agent about repo structure:
#   .code-autonomy/    — directory of .md files (per-app or per-topic)
#   .code-autonomy.md  — single repo knowledge file
#   AGENT.md           — alternative single-file name
# Priority: directory > .code-autonomy.md > AGENT.md
# Max size: 10,000 chars (excess is truncated with warning)

[tracing]
enabled = true
# storage_dir = ~/.code-autonomy/traces
storage_dir =
