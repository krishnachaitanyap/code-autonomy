# Autonomous Code Generation - Configuration
# Copy to config.ini and fill in your values.
# Supports GitHub and Bitbucket

[repository]
platform = github
repo_url = https://github.com/owner/repo.git
base_branch = main
feature_branch =

[github_config]
# Use env vars: GITHUB_TOKEN or BITBUCKET_HTTP_ACCESS_TOKEN (recommended)
auth_token = <your_token_or_leave_empty_for_env>
use_env = true

# -----------------------------------------------------------------------------
# GitHub App authentication (preferred for production / multi-user)
# -----------------------------------------------------------------------------
# When enabled = true, the agent uses a GitHub App installation token instead
# of a static PAT. Tokens auto-refresh every ~55 minutes. Set up:
#   1. Register a GitHub App at https://github.com/settings/apps/new
#      (or your org's developer settings). Required permissions:
#          Contents: Read & write
#          Pull requests: Read & write
#          Metadata: Read
#   2. Generate a private key (.pem) and store its contents in AWS Secrets
#      Manager (or another secret store).
#   3. Install the App on the org/repos that the agent should access.
#   4. Note the numeric App ID and Installation ID.
#
# See docs/repo_strategy.md for the full multi-provider auth strategy.
[github_app]
enabled = false
app_id =
installation_id =
# Provide the PEM private key via ONE of these (in priority order):
#   private_key       — inline PEM contents (avoid in committed files)
#   private_key_env   — name of env var holding the PEM (recommended for AWS)
#   private_key_path  — path to a mounted .pem file (e.g. from Secrets Manager CSI)
private_key_env = GITHUB_APP_PRIVATE_KEY
# private_key_path = /run/secrets/github-app-key.pem
# For GitHub Enterprise Server, override the API base:
# api_base_url = https://ghe.example.com/api/v3

# -----------------------------------------------------------------------------
# Bitbucket Cloud OAuth 2.0 Consumer
# -----------------------------------------------------------------------------
# Bitbucket Cloud's analogue to a GitHub App. Configure an OAuth Consumer at
# Workspace settings → OAuth consumers, with these scopes:
#     Repositories: Read, Write
#     Pull requests: Read, Write
# The agent uses the client-credentials grant; tokens auto-refresh every 2h.
#
# Bitbucket Server / Data Center has NO App equivalent — for that platform,
# use a project-scoped HTTP Access Token via BITBUCKET_HTTP_ACCESS_TOKEN.
[bitbucket_oauth]
enabled = false
client_key =
# Provide the secret via env var (recommended) or inline:
client_secret_env = BITBUCKET_OAUTH_CLIENT_SECRET
# client_secret =

[ai]
# Provider: openai | anthropic | gemini | bedrock | cdao | azure
provider = openai
# Use env: OPENAI_API_KEY (openai), ANTHROPIC_API_KEY (anthropic), GEMINI_API_KEY (gemini)
api_key = <your_api_key>
# Override env var: api_key_env = ANTHROPIC_API_KEY
model = gpt-4o
# Sampling temperature for LLM calls (0.0 = deterministic, 1.0 = creative)
temperature = 0.2
# Embedding provider: "local" (sentence-transformers, offline) or "openai" (API)
# local: runs offline, no API key needed, ~80MB model download on first use
# openai: requires OPENAI_API_KEY, higher quality, network dependent
embedding_provider = local
# Embedding model name (interpreted based on provider)
# local: all-MiniLM-L6-v2 (default), all-mpnet-base-v2, BAAI/bge-small-en-v1.5
# openai: text-embedding-3-small (default), text-embedding-3-large
# Set to empty to disable embeddings (graph-based tools still work)
embedding_model = all-MiniLM-L6-v2
# Optional: base_url for Azure/custom endpoints
# base_url = https://your-endpoint.openai.azure.com/
verbose = false
# For provider = bedrock or cdao (org Bedrock BYOA via cdao)
# aws_account_number =
# aws_region = us-east-1
# workspace_id =
# is_execution_role = false
# model = arn:aws:bedrock:us-east-1:ACCOUNT:application-inference-profile/PROFILE_ID
#
# Sample [ai] for Bedrock (uncomment and replace with your values):
# [ai]
# provider = bedrock
# model = arn:aws:bedrock:us-east-1:098034167131:application-inference-profile/hi952c095hw3
# aws_account_number = 098034167131
# aws_region = us-east-1
# workspace_id = 904071
# is_execution_role = false
#
# Sample [ai] for Azure OpenAI (uncomment and set provider = azure):
# provider = azure
# model = gpt-4o
# endpoint = https://your-endpoint.openai.azure.com/
# deployment_name = your-deployment
# api_version = 2024-02-15-preview
# api_key = <your_azure_openai_api_key>
# # For certificate auth (cert from S3): tenant_id, client_id, scope, s3_bucket_name, azure_cert_file_name
# tenant_id =
# client_id =
# scope = https://cognitiveservices.azure.com/.default
# s3_bucket_name =
# azure_cert_file_name =

[workflow]
work_dir = ./workspace
cleanup_after_pr = false
grep_patterns =
reference_pr =
# Set to true to enable agent mode by default (or use --agent / --plan / --ask CLI flags)
# Agent mode enables: code index, 7 code intelligence tools, verify-and-repair loop
use_agent = true

[agent]
# ─── Agent loop limits ───
max_turns = 50
plan_max_turns = 30
ask_max_turns = 20
# ─── Context management ───
smart_summarization = true
truncation_limit = 100000
show_activity = true
# ─── Deadline nudges (advisory turn-budget hints) ───
# Set to false to disable all nudges
nudge_enabled = true
# % of max_turns before nudging to start implementing (0.0-1.0)
explore_budget_pct = 0.30
# % of max_turns for soft progress check
soft_deadline_pct = 0.60
# % of max_turns for hard deadline
hard_deadline_pct = 0.80
# ─── Command sandboxing ───
command_allowlist_only = false
allowed_command_prefixes = pytest,python,mvn,./mvnw,gradle,./gradlew,npm,npx
blocked_commands = rm -rf /,mkfs,dd if=,shutdown,reboot
# ─── Resiliency (circuit breaker + rate limiter for LLM calls) ───
circuit_breaker_threshold = 5
circuit_breaker_timeout = 60
rate_limit_max_tokens = 10
rate_limit_refill_rate = 1.0
# ─── Skip tests ───
# When true, agent skips VERIFY/FIX steps and does not run tests
skip_tests = false
# ─── Git Context Controller (structured versioned memory) ───
# Enables gcc_commit, gcc_branch, gcc_merge, gcc_context tools
gcc_enabled = false
gcc_storage_dir =

[testing]
run_tests = true
max_regenerate_attempts = 3
test_timeout = 120
# Java testing strategy: bdd | contract | integration | unit | e2e | soap | jisi_bdd | auto
testing_strategy = auto
# Path to JISI BDD service specification file (JSON)
# Used when testing_strategy = jisi_bdd or with --bdd-spec CLI
bdd_spec_path =

[context]
# Use modular pipeline (grep from requirements, optional similarity/call graph)
use_pipeline = false
grep_enricher = true
grep_from_requirements = true
# Optional: similarity search (requires sentence-transformers)
similarity_enricher = false
similarity_top_k = 5
# Optional: call graph traversal (Python; Java requires javalang)
call_graph_enricher = false
call_graph_depth = 2
max_files = 30
max_chars_per_file = 4000

[consciousness]
backend = file
cache_dir = .consciousness
max_age_hours = 24

# ─── Code Intelligence (CodeIndex) ───
# Built automatically when agent mode is active (--agent, --plan, --ask, or use_agent=true)
# Provides: symbol table, dependency graph, class hierarchy, entity embeddings
# Enables 7 tools: find_callers, find_dependents, impact_analysis, describe_entity,
#   find_similar, context_for_edit, predict_breakage
# Also powers: post-edit verification gate + verify-and-repair loop
[code_index]
# Cache directory relative to work_dir (default: .code-index)
cache_dir = .code-index
# Rebuild index when cache is older than this (hours). 0 = always rebuild.
max_age_hours = 24
# Sliding-window chunking for large method bodies (entity embeddings)
chunk_size = 800
chunk_overlap = 200
small_body_limit = 1000
# BM25 keyword search (hybrid with vector search via RRF)
enable_bm25 = true
# Prepend import lines to each entity's embedding text
include_import_context = true

[knowledge]
backend = file
# storage_dir = ~/.code-autonomy/knowledge
storage_dir =
opensearch_url =
opensearch_index =
aws_region =

# ─── Repo knowledge files ───
# Place in your repository root to teach the agent about repo structure:
#   .code-autonomy/    — directory of .md files (per-app or per-topic)
#   .code-autonomy.md  — single repo knowledge file
#   AGENT.md           — alternative single-file name
# Priority: directory > .code-autonomy.md > AGENT.md
# Max size: 10,000 chars (excess is truncated with warning)
# Auto-generate with: python main.py --init-knowledge --repo-path /path/to/repo

[jira]
# JIRA integration — pull stories labeled for the agent and process them
# OAuth / ADFS token endpoint
base_url = https://jira.example.com/rest/api/2
ida_url = https://your-idp.example.com/adfs/oauth2/token
resource =
client_id =
# Credentials (fallback: JIRA_USERNAME / JIRA_PASSWORD env vars)
username =
password =
grant_type = password
# Project & label filter
project_key = SPS
agent_label = code-autonomy
# Custom field ID for acceptance criteria
acceptance_criteria_field = customfield_11110
# Connection settings
verify_ssl = false
timeout = 30
max_stories = 50
# Automatically transition ticket to "In Progress" when agent starts
auto_transition_start = true
# Automatically transition ticket to "Done" when agent finishes
auto_transition_done = false
# Auto-retry with --resume when agent runs out of turns (1 = no retry)
max_retries = 2

[bitbucket]
# Bitbucket Server / Data Center integration (used with --jira mode)
# When enabled, the agent will clone from Bitbucket, create branches per story,
# commit+push changes, and create PRs via Bitbucket Server REST API 1.0
enabled = false
base_url = https://bitbucketdc-digital.example.com
# Bearer token for Bitbucket Server (fallback: BITBUCKET_SERVER_TOKEN env var)
user_token =
# Clone URL (SSH or HTTPS). If empty, derived from base_url + project_key + repo_slug
clone_url =
project_key =
repo_slug =
base_branch = main
verify_ssl = false
# clone_protocol: ssh | https
clone_protocol = ssh

[opensearch]
# OpenSearch integration for Splunk metadata RAG (knn similarity search)
enabled = false
endpoint = https://search-xxx.us-east-1.es.amazonaws.com
region = us-east-1
aws_access_key_id =
aws_secret_access_key =
index_name = splunk-metadata
# Embedding model for knn queries (must match what was used to build content_vector)
embedding_model = text-embedding-3-small
verify_ssl = true
timeout = 30

[splunk]
# Splunk integration — query production logs, metrics, and saved reports
enabled = false
base_url = https://splunk.example.com:8089
username =
password =
app = search
default_earliest = -24h
default_latest = now
verify_ssl = false
timeout = 30
max_results = 1000

[artifact_repository]
# Enterprise artifact repository for downloading dependency sources
# Supports Maven (Artifactory/Nexus), npm, and Gradle plugin repos
enabled = false

# Maven / Gradle artifact repository
maven_mirror_url =                  # e.g. https://artifactory.corp.example.com/maven-virtual
maven_mirror_id = enterprise        # mirror ID for settings.xml
maven_release_url =                 # release repo URL (if different from mirror)
maven_snapshot_url =                # snapshot repo URL
maven_username =                    # (fallback: ARTIFACT_REPO_MAVEN_USERNAME env var)
maven_password =                    # (fallback: ARTIFACT_REPO_MAVEN_PASSWORD env var)

# npm registry
npm_registry_url =                  # e.g. https://artifactory.corp.example.com/api/npm/npm-virtual
npm_auth_token =                    # (fallback: ARTIFACT_REPO_NPM_AUTH_TOKEN env var)

# Gradle plugin repository (if different from Maven)
gradle_plugin_url =                 # e.g. https://artifactory.corp.example.com/gradle-plugins

# SSL
verify_ssl = true
ca_cert_path =                      # path to custom CA cert bundle (for self-signed enterprise CAs)

[tracing]
enabled = true
# storage_dir = ~/.code-autonomy/traces
storage_dir =

# ─── Tool Credential Profiles ───
# Define credential profiles that tools can reference via config_section.
# Alternatively, credentials can be entered directly in the Tools UI.
#
# [tool_cred_kerberos_prod]
# auth_type = kerberos
# realm = CORP.EXAMPLE.COM
# kdc = kdc.corp.example.com
# principal = svc-account@CORP.EXAMPLE.COM
# keytab_path = /etc/security/keytabs/svc-account.keytab
#
# [tool_cred_internal_api]
# auth_type = basic
# username =          (fallback: INTERNAL_API_USERNAME env var)
# password =          (fallback: INTERNAL_API_PASSWORD env var)
# base_url = https://api.internal.example.com
#
# [tool_cred_bearer_api]
# auth_type = bearer
# token =             (fallback: BEARER_API_TOKEN env var)
# base_url = https://api.example.com
#
# Example: Migrate existing [splunk] credentials to a tool credential profile.
# The seeded "Splunk" custom tool can reference this via config_section = splunk_prod
# [tool_cred_splunk_prod]
# auth_type = basic
# base_url = https://splunk.example.com:8089
# username =          (fallback: SPLUNK_PROD_USERNAME env var)
# password =          (fallback: SPLUNK_PROD_PASSWORD env var)
